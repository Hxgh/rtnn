name: ci-check

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

env:
  TEMPLATE_PROJECT_ID: ${{ vars.TEMPLATE_PROJECT_ID }}
  TEMPLATE_BRAND_NAME: ${{ vars.TEMPLATE_BRAND_NAME }}
  TEMPLATE_COOKIE_PREFIX: ${{ vars.TEMPLATE_COOKIE_PREFIX }}
  TEMPLATE_DATABASE_NAME: rtnn
  TEMPLATE_DATABASE_USER: postgres
  TEMPLATE_DATABASE_PASSWORD: postgres

concurrency:
  group: ci-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-live-state-only:
    name: Detect Live State Only Change
    runs-on: ${{ (github.event_name == 'pull_request' || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      live_state_only: ${{ steps.detect.outputs.live_state_only }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect liveState-only change
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT_NAME}" != "push" || "${EVENT_REF}" != "refs/heads/main" ]]; then
            {
              echo "live_state_only=false"
              echo "reason=not-main-push"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/release/detect-live-state-only-change.mjs \
            --base "${EVENT_BEFORE}" \
            --head "${EVENT_SHA}"

  skip-live-state-only:
    name: Skip Live State Only Change
    runs-on: ${{ (github.event_name == 'pull_request' || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs: detect-live-state-only
    if: ${{ needs.detect-live-state-only.outputs.live_state_only == 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "ci-check skipped: ${{ needs.detect-live-state-only.outputs.reason }}"

  quality:
    name: Lint Typecheck Test Build
    needs: detect-live-state-only
    if: ${{ needs.detect-live-state-only.outputs.live_state_only != 'true' }}
    runs-on: ${{ (github.event_name == 'pull_request' || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin/package.json
            apps/app/package.json
            apps/backend/package.json
            apps/weapp/package.json
            clients/*/package.json
            packages/*/package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Release candidate gate
        run: pnpm run check:release-candidate

      - name: Build
        run: pnpm run build
