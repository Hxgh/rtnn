name: ci-check

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

env:
  TEMPLATE_PROJECT_ID: ${{ vars.TEMPLATE_PROJECT_ID }}
  TEMPLATE_BRAND_NAME: ${{ vars.TEMPLATE_BRAND_NAME }}
  TEMPLATE_COOKIE_PREFIX: ${{ vars.TEMPLATE_COOKIE_PREFIX }}
  TEMPLATE_DATABASE_NAME: rtnn
  TEMPLATE_DATABASE_USER: postgres
  TEMPLATE_DATABASE_PASSWORD: postgres

concurrency:
  group: ci-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint Typecheck Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin/package.json
            apps/app/package.json
            apps/backend/package.json
            apps/weapp/package.json
            clients/*/package.json
            packages/*/package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Release candidate gate
        run: pnpm run check:release-candidate

      - name: Build
        run: pnpm run build
