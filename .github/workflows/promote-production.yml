# 业务源码仓 production promote 主线。
# 上游模板仓会保留此 workflow 以便业务仓同步，但只有 business-source 仓会真正执行发布。

name: promote-production

on:
  workflow_dispatch:
    inputs:
      deploy_version:
        description: production 发布版本，例如 v1.0.0
        required: true
        type: string
      source_sha:
        description: 源 commit sha，可选
        required: false
        type: string
      image_owner:
        description: GHCR owner，默认当前仓库 owner
        required: false
        type: string
      backend_image:
        description: backend 镜像，留空则按默认规则推导
        required: false
        type: string
      admin_image:
        description: admin 镜像，留空则按默认规则推导
        required: false
        type: string
      app_image:
        description: app 镜像，留空则按默认规则推导
        required: false
        type: string
      weapp_image:
        description: weapp 镜像，留空则按默认规则推导
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-promote-context:
    name: Resolve Promote Context
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      reason: ${{ steps.context.outputs.reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect repository role
        id: context
        shell: bash
        run: |
          if [[ ! -f ".rtnn/project.json" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=missing-project-metadata" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          REPO_ROLE="$(jq -r '.project.role // empty' .rtnn/project.json)"

          if [[ "${REPO_ROLE}" != "business-source" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=repo-role-disabled" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "reason=business-source" >> "${GITHUB_OUTPUT}"

  skip-template-repository:
    name: Skip Template Repository Promote
    runs-on: ubuntu-latest
    needs: resolve-promote-context
    if: ${{ needs.resolve-promote-context.outputs.enabled != 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "promote-production skipped: ${{ needs.resolve-promote-context.outputs.reason || 'not-business-source' }}"

  notify-deploy:
    name: Dispatch Production Promote
    runs-on: ubuntu-latest
    needs: resolve-promote-context
    if: ${{ needs.resolve-promote-context.outputs.enabled == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate dispatch config
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          DEPLOY_REPO="$(jq -r '.deployment.repo // empty' .rtnn/project.json)"
          [[ -n "${DEPLOY_REPO}" ]] || { echo "缺少 deployment.repo"; exit 1; }
          [[ -n "${DISPATCH_TOKEN}" ]] || { echo "缺少 DEPLOY_REPOSITORY_DISPATCH_TOKEN"; exit 1; }

      - name: Resolve release payload
        id: payload
        shell: bash
        env:
          INPUT_DEPLOY_VERSION: ${{ inputs.deploy_version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_IMAGE_OWNER: ${{ inputs.image_owner }}
          INPUT_BACKEND_IMAGE: ${{ inputs.backend_image }}
          INPUT_ADMIN_IMAGE: ${{ inputs.admin_image }}
          INPUT_APP_IMAGE: ${{ inputs.app_image }}
          INPUT_WEAPP_IMAGE: ${{ inputs.weapp_image }}
        run: |
          PROJECT_ID="$(jq -r '.project.projectId // empty' .rtnn/project.json)"
          IMAGE_NAME_PREFIX="$(jq -r '.deployment.imageNamePrefix // .project.projectId // empty' .rtnn/project.json)"
          DEPLOY_APPLICATION_NAME="$(jq -r '.deployment.application // .project.projectId // empty' .rtnn/project.json)"
          DEPLOY_REPO="$(jq -r '.deployment.repo // empty' .rtnn/project.json)"
          DEPLOY_VERSION="${INPUT_DEPLOY_VERSION}"
          IMAGE_OWNER="${INPUT_IMAGE_OWNER:-${GITHUB_REPOSITORY_OWNER,,}}"
          IMAGE_PREFIX="ghcr.io/${IMAGE_OWNER}"
          EVENT_TYPE="$(jq -r '.deployment.dispatchEventType // empty' .rtnn/project.json)"

          BACKEND_IMAGE="${INPUT_BACKEND_IMAGE:-${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-backend:${DEPLOY_VERSION}}"
          ADMIN_IMAGE="${INPUT_ADMIN_IMAGE:-${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-admin:${DEPLOY_VERSION}}"
          APP_IMAGE="${INPUT_APP_IMAGE:-${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-app:${DEPLOY_VERSION}}"
          WEAPP_IMAGE="${INPUT_WEAPP_IMAGE:-${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-weapp:${DEPLOY_VERSION}}"
          SOURCE_SHA="${INPUT_SOURCE_SHA:-unknown}"

          {
            echo "dispatch_url=https://api.github.com/repos/${DEPLOY_REPO}/dispatches"
            echo "event_type=${EVENT_TYPE}"
            echo "version=${DEPLOY_VERSION}"
            echo "deploy_application=${DEPLOY_APPLICATION_NAME}"
            echo "source_sha=${SOURCE_SHA}"
            echo "backend_image=${BACKEND_IMAGE}"
            echo "admin_image=${ADMIN_IMAGE}"
            echo "app_image=${APP_IMAGE}"
            echo "weapp_image=${WEAPP_IMAGE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch deploy event
        shell: bash
        env:
          DISPATCH_URL: ${{ steps.payload.outputs.dispatch_url }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.payload.outputs.event_type }}
          VERSION: ${{ steps.payload.outputs.version }}
          DEPLOY_APPLICATION: ${{ steps.payload.outputs.deploy_application }}
          SOURCE_SHA: ${{ steps.payload.outputs.source_sha }}
          BACKEND_IMAGE: ${{ steps.payload.outputs.backend_image }}
          ADMIN_IMAGE: ${{ steps.payload.outputs.admin_image }}
          APP_IMAGE: ${{ steps.payload.outputs.app_image }}
          WEAPP_IMAGE: ${{ steps.payload.outputs.weapp_image }}
        run: |
          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "production" \
            --arg version "${VERSION}" \
            --arg sha "${SOURCE_SHA}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg backend "${BACKEND_IMAGE}" \
            --arg admin "${ADMIN_IMAGE}" \
            --arg app "${APP_IMAGE}" \
            --arg weapp "${WEAPP_IMAGE}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                source_repository: $source_repository,
                source_ref: $source_ref,
                images: {
                  backend: $backend,
                  admin: $admin,
                  app: $app,
                  weapp: $weapp
                }
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"
