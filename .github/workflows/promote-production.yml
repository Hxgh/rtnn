# 业务源码仓 production promote 主线。
# 上游模板仓会保留此 workflow 以便业务仓同步，但只有 business-source 仓会真正执行发布。

name: promote-production

on:
  workflow_dispatch:
    inputs:
      deploy_version:
        description: production 发布版本，例如 v1.0.0
        required: true
        type: string
      source_sha:
        description: 源 commit sha，可选
        required: false
        type: string
      image_owner:
        description: GHCR owner，默认当前仓库 owner
        required: false
        type: string
      backend_image:
        description: backend 镜像，留空则按默认规则推导
        required: false
        type: string
      admin_image:
        description: admin 镜像，留空则按默认规则推导
        required: false
        type: string
      app_image:
        description: app 镜像，留空则按默认规则推导
        required: false
        type: string
      weapp_image:
        description: weapp 镜像，留空则按默认规则推导
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-promote-context:
    name: Resolve Promote Context
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      reason: ${{ steps.context.outputs.reason }}
      enabled_services_json: ${{ steps.context.outputs.enabled_services_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect repository role
        id: context
        run: node scripts/release/resolve-release-context.mjs --mode=promote

  skip-template-repository:
    name: Skip Template Repository Promote
    runs-on: ubuntu-latest
    needs: resolve-promote-context
    if: ${{ needs.resolve-promote-context.outputs.enabled != 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "promote-production skipped: ${{ needs.resolve-promote-context.outputs.reason || 'not-business-source' }}"

  notify-deploy:
    name: Dispatch Production Promote
    runs-on: ubuntu-latest
    needs: resolve-promote-context
    if: ${{ needs.resolve-promote-context.outputs.enabled == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate dispatch config
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          DEPLOY_REPO="$(jq -r '.deployment.repo // empty' .rtnn/project.json)"
          [[ -n "${DEPLOY_REPO}" ]] || { echo "缺少 deployment.repo"; exit 1; }
          [[ -n "${DISPATCH_TOKEN}" ]] || { echo "缺少 DEPLOY_REPOSITORY_DISPATCH_TOKEN"; exit 1; }

      - name: Resolve release payload
        id: payload
        shell: bash
        env:
          INPUT_DEPLOY_VERSION: ${{ inputs.deploy_version }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_IMAGE_OWNER: ${{ inputs.image_owner }}
          INPUT_BACKEND_IMAGE: ${{ inputs.backend_image }}
          INPUT_ADMIN_IMAGE: ${{ inputs.admin_image }}
          INPUT_APP_IMAGE: ${{ inputs.app_image }}
          INPUT_WEAPP_IMAGE: ${{ inputs.weapp_image }}
          ENABLED_SERVICES_JSON: ${{ needs.resolve-promote-context.outputs.enabled_services_json }}
        run: |
          PROJECT_ID="$(jq -er '.project.projectId' .rtnn/project.json)"
          IMAGE_NAME_PREFIX="$(jq -er '.deployment.imageNamePrefix // .project.projectId' .rtnn/project.json)"
          DEPLOY_APPLICATION_NAME="$(jq -er '.deployment.application // .project.projectId' .rtnn/project.json)"
          DEPLOY_REPO="$(jq -er '.deployment.repo' .rtnn/project.json)"
          DEPLOY_VERSION="${INPUT_DEPLOY_VERSION}"
          IMAGE_OWNER="${INPUT_IMAGE_OWNER:-${GITHUB_REPOSITORY_OWNER,,}}"
          IMAGE_PREFIX="ghcr.io/${IMAGE_OWNER}"
          EVENT_TYPE="$(jq -er '.deployment.dispatchEventType' .rtnn/project.json)"

          [[ "${DEPLOY_VERSION}" =~ ^v[0-9].* ]] || {
            echo "deploy_version 必须是 v* tag";
            exit 1;
          }

          image_overrides="$(jq -nc \
            --arg backend "${INPUT_BACKEND_IMAGE}" \
            --arg admin "${INPUT_ADMIN_IMAGE}" \
            --arg app "${INPUT_APP_IMAGE}" \
            --arg weapp "${INPUT_WEAPP_IMAGE}" \
            '{backend: $backend, admin: $admin, app: $app, weapp: $weapp}'
          )"
          images_json="$(jq -nc \
            --arg image_prefix "${IMAGE_PREFIX}" \
            --arg name_prefix "${IMAGE_NAME_PREFIX}" \
            --arg version "${DEPLOY_VERSION}" \
            --argjson services "${ENABLED_SERVICES_JSON}" \
            --argjson overrides "${image_overrides}" \
            'reduce $services[] as $service ({}; .[$service] = (if ($overrides[$service] // "") != "" then $overrides[$service] else "\($image_prefix)/\($name_prefix)-\($service):\($version)" end))'
          )"
          SOURCE_SHA="${INPUT_SOURCE_SHA}"

          if [[ -z "${SOURCE_SHA}" ]]; then
            git fetch --tags --force origin
            SOURCE_SHA="$(git rev-list -n 1 "${DEPLOY_VERSION}" 2>/dev/null || true)"
          fi

          [[ -n "${SOURCE_SHA}" ]] || {
            echo "未找到 tag ${DEPLOY_VERSION} 对应的提交；可手动填写 source_sha";
            exit 1;
          }

          {
            echo "dispatch_url=https://api.github.com/repos/${DEPLOY_REPO}/dispatches"
            echo "event_type=${EVENT_TYPE}"
            echo "version=${DEPLOY_VERSION}"
            echo "deploy_application=${DEPLOY_APPLICATION_NAME}"
            echo "source_sha=${SOURCE_SHA}"
            echo "source_ref=refs/tags/${DEPLOY_VERSION}"
            echo "images_json=${images_json}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch deploy event
        shell: bash
        env:
          DISPATCH_URL: ${{ steps.payload.outputs.dispatch_url }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.payload.outputs.event_type }}
          VERSION: ${{ steps.payload.outputs.version }}
          DEPLOY_APPLICATION: ${{ steps.payload.outputs.deploy_application }}
          SOURCE_SHA: ${{ steps.payload.outputs.source_sha }}
          SOURCE_REF: ${{ steps.payload.outputs.source_ref }}
          IMAGES_JSON: ${{ steps.payload.outputs.images_json }}
        run: |
          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "production" \
            --arg version "${VERSION}" \
            --arg sha "${SOURCE_SHA}" \
            --arg source_repository "${GITHUB_REPOSITORY}" \
            --arg source_ref "${SOURCE_REF}" \
            --argjson images "${IMAGES_JSON}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                source_repository: $source_repository,
                source_ref: $source_ref,
                images: $images
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"
