# 业务源码仓镜像发布主线。
# 上游模板仓会保留此 workflow 以便业务仓同步，但只有 business-source 仓会真正执行发布。

name: release-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release-context:
    name: Resolve Release Context
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      reason: ${{ steps.context.outputs.reason }}
      project_id: ${{ steps.context.outputs.project_id }}
      image_name_prefix: ${{ steps.context.outputs.image_name_prefix }}
      deploy_application: ${{ steps.context.outputs.deploy_application }}
      deploy_event_type: ${{ steps.context.outputs.deploy_event_type }}
      deploy_repo: ${{ steps.context.outputs.deploy_repo }}
      deploy_environment: ${{ steps.context.outputs.deploy_environment }}
      version: ${{ steps.context.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve business project metadata
        id: context
        shell: bash
        run: |
          if [[ ! -f ".rtnn/project.json" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=missing-project-metadata" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PROJECT_ROLE="$(jq -r '.project.role // empty' .rtnn/project.json)"
          if [[ "${PROJECT_ROLE}" != "business-source" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=repo-role-disabled" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          PROJECT_ID="$(jq -er '.project.projectId' .rtnn/project.json)"
          IMAGE_NAME_PREFIX="$(jq -er '.deployment.imageNamePrefix // .project.projectId' .rtnn/project.json)"
          DEPLOY_APPLICATION="$(jq -er '.deployment.application // .project.projectId' .rtnn/project.json)"
          DEPLOY_EVENT_TYPE="$(jq -er '.deployment.dispatchEventType' .rtnn/project.json)"
          DEPLOY_REPO="$(jq -r '.deployment.repo // empty' .rtnn/project.json)"

          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            DEPLOY_ENVIRONMENT="testing"
            VERSION="main-${SHORT_SHA}"
          else
            DEPLOY_ENVIRONMENT=""
            VERSION="${GITHUB_REF_NAME}"
          fi

          {
            echo "enabled=true"
            echo "reason=business-source"
            echo "project_id=${PROJECT_ID}"
            echo "image_name_prefix=${IMAGE_NAME_PREFIX}"
            echo "deploy_application=${DEPLOY_APPLICATION}"
            echo "deploy_event_type=${DEPLOY_EVENT_TYPE}"
            echo "deploy_repo=${DEPLOY_REPO}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

  skip-template-repository:
    name: Skip Template Repository Release
    runs-on: ubuntu-latest
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.enabled != 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "release-images skipped: ${{ needs.resolve-release-context.outputs.reason || 'not-business-source' }}"

  verify-release:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.enabled == 'true' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin/package.json
            apps/app/package.json
            apps/backend/package.json
            apps/weapp/package.json
            packages/*/package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Release candidate gate
        run: pnpm run check:release-candidate

  build-and-push:
    name: Build And Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - resolve-release-context
      - verify-release
    if: ${{ needs.verify-release.result == 'success' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - admin
          - app
          - weapp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: vars
        shell: bash
        env:
          IMAGE_NAME_PREFIX: ${{ needs.resolve-release-context.outputs.image_name_prefix }}
          VERSION: ${{ needs.resolve-release-context.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-release-context.outputs.deploy_environment }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME_PREFIX}-${{ matrix.service }}"

          if [[ -n "${DEPLOY_ENVIRONMENT}" ]]; then
            CHANNEL="testing-latest"
          else
            CHANNEL="production-latest"
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  notify-deploy:
    name: Notify Deploy Repository
    runs-on: ubuntu-latest
    needs:
      - resolve-release-context
      - build-and-push
    if: ${{ needs.build-and-push.result == 'success' && needs.resolve-release-context.outputs.deploy_environment == 'testing' }}

    steps:
      - name: Detect deploy dispatch config
        id: dispatch
        shell: bash
        env:
          DEPLOY_REPO: ${{ needs.resolve-release-context.outputs.deploy_repo }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${DEPLOY_REPO}" || -z "${DISPATCH_TOKEN}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=missing-dispatch-config" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "dispatch_url=https://api.github.com/repos/${DEPLOY_REPO}/dispatches" >> "${GITHUB_OUTPUT}"

      - name: Skip deploy dispatch
        if: ${{ steps.dispatch.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "deploy dispatch skipped: ${{ steps.dispatch.outputs.reason || 'not-enabled' }}"

      - name: Dispatch deploy event
        if: ${{ steps.dispatch.outputs.enabled == 'true' }}
        env:
          DISPATCH_URL: ${{ steps.dispatch.outputs.dispatch_url }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ needs.resolve-release-context.outputs.deploy_event_type }}
          VERSION: ${{ needs.resolve-release-context.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-release-context.outputs.deploy_environment }}
          DEPLOY_APPLICATION: ${{ needs.resolve-release-context.outputs.deploy_application }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          IMAGE_NAME_PREFIX: ${{ needs.resolve-release-context.outputs.image_name_prefix }}
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME_PREFIX}"
          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "${DEPLOY_ENVIRONMENT}" \
            --arg version "${VERSION}" \
            --arg sha "${GITHUB_SHA}" \
            --arg source_repository "${SOURCE_REPOSITORY}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg backend "${IMAGE_PREFIX}-backend:${VERSION}" \
            --arg admin "${IMAGE_PREFIX}-admin:${VERSION}" \
            --arg app "${IMAGE_PREFIX}-app:${VERSION}" \
            --arg weapp "${IMAGE_PREFIX}-weapp:${VERSION}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                source_repository: $source_repository,
                source_ref: $source_ref,
                images: {
                  backend: $backend,
                  admin: $admin,
                  app: $app,
                  weapp: $weapp
                }
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"
