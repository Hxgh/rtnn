name: release-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Release candidate gate
        run: pnpm run check:release-candidate

  build-and-push:
    name: Build And Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - admin
          - app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: vars
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rtnn-${{ matrix.service }}"
          SHORT_SHA="${GITHUB_SHA::12}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CHANNEL="prod-latest"
            DEPLOY_ENVIRONMENT="production"
          else
            VERSION="main-${SHORT_SHA}"
            CHANNEL="staging-latest"
            DEPLOY_ENVIRONMENT="staging"
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  notify-deploy:
    name: Notify Deploy Repository
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_URL != '' && secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN != '' }}

    steps:
      - name: Resolve release payload
        id: payload
        shell: bash
        env:
          DEPLOY_EVENT_TYPE: ${{ secrets.DEPLOY_REPOSITORY_EVENT_TYPE }}
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            DEPLOY_ENVIRONMENT="production"
          else
            VERSION="main-${SHORT_SHA}"
            DEPLOY_ENVIRONMENT="staging"
          fi

          EVENT_TYPE="${DEPLOY_EVENT_TYPE:-promote-rtnn}"
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          {
            echo "event_type=${EVENT_TYPE}"
            echo "version=${VERSION}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
            echo "backend_image=${IMAGE_PREFIX}/rtnn-backend:${VERSION}"
            echo "admin_image=${IMAGE_PREFIX}/rtnn-admin:${VERSION}"
            echo "app_image=${IMAGE_PREFIX}/rtnn-app:${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch deploy event
        env:
          DISPATCH_URL: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_URL }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.payload.outputs.event_type }}
          VERSION: ${{ steps.payload.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ steps.payload.outputs.deploy_environment }}
          BACKEND_IMAGE: ${{ steps.payload.outputs.backend_image }}
          ADMIN_IMAGE: ${{ steps.payload.outputs.admin_image }}
          APP_IMAGE: ${{ steps.payload.outputs.app_image }}
        run: |
          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$(cat <<JSON
          {
            \"event_type\": \"${EVENT_TYPE}\",
            \"client_payload\": {
              \"application\": \"rtnn\",
              \"environment\": \"${DEPLOY_ENVIRONMENT}\",
              \"version\": \"${VERSION}\",
              \"sha\": \"${GITHUB_SHA}\",
              \"images\": {
                \"backend\": \"${BACKEND_IMAGE}\",
                \"admin\": \"${ADMIN_IMAGE}\",
                \"app\": \"${APP_IMAGE}\"
              }
            }
          }
          JSON
          )"
