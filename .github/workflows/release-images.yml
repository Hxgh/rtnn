name: release-images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  TEMPLATE_PROJECT_ID: ${{ vars.TEMPLATE_PROJECT_ID }}
  TEMPLATE_BRAND_NAME: ${{ vars.TEMPLATE_BRAND_NAME }}
  TEMPLATE_COOKIE_PREFIX: ${{ vars.TEMPLATE_COOKIE_PREFIX }}
  TEMPLATE_DATABASE_NAME: rtnn
  TEMPLATE_DATABASE_USER: postgres
  TEMPLATE_DATABASE_PASSWORD: postgres
  TEMPLATE_IMAGE_NAME_PREFIX: ${{ vars.TEMPLATE_IMAGE_NAME_PREFIX }}
  TEMPLATE_DEPLOY_APPLICATION: ${{ vars.TEMPLATE_DEPLOY_APPLICATION }}
  TEMPLATE_DEPLOY_EVENT_TYPE: ${{ vars.TEMPLATE_DEPLOY_EVENT_TYPE }}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin/package.json
            apps/app/package.json
            apps/backend/package.json
            apps/weapp/package.json
            packages/*/package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Release candidate gate
        run: pnpm run check:release-candidate

  build-and-push:
    name: Build And Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - admin
          - app
          - weapp

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: vars
        shell: bash
        run: |
          PROJECT_ID="${TEMPLATE_PROJECT_ID:-rtnn}"
          IMAGE_NAME_PREFIX="${TEMPLATE_IMAGE_NAME_PREFIX:-$PROJECT_ID}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME_PREFIX}-${{ matrix.service }}"
          SHORT_SHA="${GITHUB_SHA::12}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CHANNEL="production-latest"
            DEPLOY_ENVIRONMENT=""
          else
            VERSION="main-${SHORT_SHA}"
            CHANNEL="testing-latest"
            DEPLOY_ENVIRONMENT="testing"
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  notify-deploy:
    name: Notify Deploy Repository
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Detect deploy dispatch config
        id: dispatch
        shell: bash
        env:
          DISPATCH_URL: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_URL }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${DISPATCH_URL}" || -z "${DISPATCH_TOKEN}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Resolve release payload
        if: ${{ steps.dispatch.outputs.enabled == 'true' }}
        id: payload
        shell: bash
        env:
          DEPLOY_EVENT_TYPE: ${{ secrets.DEPLOY_REPOSITORY_EVENT_TYPE }}
        run: |
          PROJECT_ID="${TEMPLATE_PROJECT_ID:-rtnn}"
          IMAGE_NAME_PREFIX="${TEMPLATE_IMAGE_NAME_PREFIX:-$PROJECT_ID}"
          DEPLOY_APPLICATION_NAME="${TEMPLATE_DEPLOY_APPLICATION:-$PROJECT_ID}"
          SHORT_SHA="${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="main-${SHORT_SHA}"
            DEPLOY_ENVIRONMENT="testing"
          else
            VERSION="${GITHUB_REF_NAME}"
            DEPLOY_ENVIRONMENT=""
          fi

          EVENT_TYPE="${DEPLOY_EVENT_TYPE:-${TEMPLATE_DEPLOY_EVENT_TYPE:-promote-${PROJECT_ID}}}"
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

          {
            echo "event_type=${EVENT_TYPE}"
            echo "version=${VERSION}"
            echo "deploy_environment=${DEPLOY_ENVIRONMENT}"
            echo "deploy_application=${DEPLOY_APPLICATION_NAME}"
            echo "backend_image=${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-backend:${VERSION}"
            echo "admin_image=${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-admin:${VERSION}"
            echo "app_image=${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-app:${VERSION}"
            echo "weapp_image=${IMAGE_PREFIX}/${IMAGE_NAME_PREFIX}-weapp:${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch deploy event
        if: ${{ steps.dispatch.outputs.enabled == 'true' && steps.payload.outputs.deploy_environment != '' }}
        env:
          DISPATCH_URL: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_URL }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.payload.outputs.event_type }}
          VERSION: ${{ steps.payload.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ steps.payload.outputs.deploy_environment }}
          DEPLOY_APPLICATION: ${{ steps.payload.outputs.deploy_application }}
          BACKEND_IMAGE: ${{ steps.payload.outputs.backend_image }}
          ADMIN_IMAGE: ${{ steps.payload.outputs.admin_image }}
          APP_IMAGE: ${{ steps.payload.outputs.app_image }}
          WEAPP_IMAGE: ${{ steps.payload.outputs.weapp_image }}
        run: |
          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "${DEPLOY_ENVIRONMENT}" \
            --arg version "${VERSION}" \
            --arg sha "${GITHUB_SHA}" \
            --arg backend "${BACKEND_IMAGE}" \
            --arg admin "${ADMIN_IMAGE}" \
            --arg app "${APP_IMAGE}" \
            --arg weapp "${WEAPP_IMAGE}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                images: {
                  backend: $backend,
                  admin: $admin,
                  app: $app,
                  weapp: $weapp
                }
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"
