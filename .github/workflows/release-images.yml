# 业务源码仓镜像发布主线。
# 上游模板仓会保留此 workflow 以便业务仓同步，但只有 business-source 仓会真正执行发布。

name: release-images

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Release workflow execution mode. Default uses the server self-hosted runner; GitHub-hosted is explicit opt-in.
        required: false
        default: server-local
        type: choice
        options:
          - server-local
          - github-hosted
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-live-state-only:
    name: Detect Live State Only Change
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      live_state_only: ${{ steps.detect.outputs.live_state_only }}
      reason: ${{ steps.detect.outputs.reason }}

    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect liveState-only change
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          if [[ "${EVENT_NAME}" != "push" || "${EVENT_REF}" != "refs/heads/main" ]]; then
            {
              echo "live_state_only=false"
              echo "reason=not-main-push"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/release/detect-live-state-only-change.mjs \
            --base "${EVENT_BEFORE}" \
            --head "${EVENT_SHA}"

  skip-live-state-only:
    name: Skip Live State Only Change
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs: detect-live-state-only
    if: ${{ needs.detect-live-state-only.outputs.live_state_only == 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "release-images skipped: ${{ needs.detect-live-state-only.outputs.reason }}"

  resolve-release-context:
    name: Resolve Release Context
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs: detect-live-state-only
    if: ${{ needs.detect-live-state-only.outputs.live_state_only != 'true' }}
    outputs:
      enabled: ${{ steps.context.outputs.enabled }}
      reason: ${{ steps.context.outputs.reason }}
      project_id: ${{ steps.context.outputs.project_id }}
      image_name_prefix: ${{ steps.context.outputs.image_name_prefix }}
      deploy_application: ${{ steps.context.outputs.deploy_application }}
      deploy_event_type: ${{ steps.context.outputs.deploy_event_type }}
      deploy_repo: ${{ steps.context.outputs.deploy_repo }}
      deploy_environment: ${{ steps.context.outputs.deploy_environment }}
      release_execution_mode: ${{ steps.context.outputs.release_execution_mode }}
      version: ${{ steps.context.outputs.version }}
      service_matrix: ${{ steps.context.outputs.service_matrix }}
      enabled_services_json: ${{ steps.context.outputs.enabled_services_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve business project metadata
        id: context
        env:
          RTNN_RELEASE_EXECUTION_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.execution_mode) || vars.RTNN_RELEASE_EXECUTION_MODE || '' }}
        run: node scripts/release/resolve-release-context.mjs

  skip-template-repository:
    name: Skip Template Repository Release
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.enabled != 'true' }}

    steps:
      - name: Explain skip
        shell: bash
        run: |
          echo "release-images skipped: ${{ needs.resolve-release-context.outputs.reason || 'not-business-source' }}"

  verify-release:
    name: Verify Release Candidate
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.enabled == 'true' && needs.resolve-release-context.outputs.release_execution_mode == 'github-hosted' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rtnn
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rtnn"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            package.json
            pnpm-workspace.yaml
            apps/admin/package.json
            apps/app/package.json
            apps/backend/package.json
            apps/weapp/package.json
            clients/*/package.json
            packages/*/package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Template bootstrap gate
        run: pnpm run check:template-bootstrap

      - name: Install Playwright Chromium
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      - name: Release candidate gate
        run: pnpm run check:release-candidate

  build-and-push:
    name: Build And Push ${{ matrix.service }}
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs:
      - resolve-release-context
      - verify-release
    if: ${{ needs.verify-release.result == 'success' && needs.resolve-release-context.outputs.release_execution_mode == 'github-hosted' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-release-context.outputs.service_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: vars
        shell: bash
        env:
          IMAGE_NAME_PREFIX: ${{ needs.resolve-release-context.outputs.image_name_prefix }}
          VERSION: ${{ needs.resolve-release-context.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-release-context.outputs.deploy_environment }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME_PREFIX}-${{ matrix.service }}"

          if [[ -n "${DEPLOY_ENVIRONMENT}" ]]; then
            CHANNEL="testing-latest"
          else
            CHANNEL="production-latest"
          fi

          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build And Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.channel }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  notify-deploy:
    name: Notify Deploy Repository With Images
    runs-on: ${{ ((github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'github-hosted') || vars.RTNN_RELEASE_EXECUTION_MODE == 'github-hosted') && 'ubuntu-latest' || 'self-hosted' }}
    needs:
      - resolve-release-context
      - build-and-push
    if: ${{ needs.build-and-push.result == 'success' && needs.resolve-release-context.outputs.release_execution_mode == 'github-hosted' && needs.resolve-release-context.outputs.deploy_environment == 'testing' }}

    steps:
      - name: Detect deploy dispatch config
        id: dispatch
        shell: bash
        env:
          DEPLOY_REPO: ${{ needs.resolve-release-context.outputs.deploy_repo }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${DEPLOY_REPO}" || -z "${DISPATCH_TOKEN}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=missing-dispatch-config" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "dispatch_url=https://api.github.com/repos/${DEPLOY_REPO}/dispatches" >> "${GITHUB_OUTPUT}"

      - name: Skip deploy dispatch
        if: ${{ steps.dispatch.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "deploy dispatch skipped: ${{ steps.dispatch.outputs.reason || 'not-enabled' }}"

      - name: Dispatch deploy event
        if: ${{ steps.dispatch.outputs.enabled == 'true' }}
        env:
          DISPATCH_URL: ${{ steps.dispatch.outputs.dispatch_url }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ needs.resolve-release-context.outputs.deploy_event_type }}
          VERSION: ${{ needs.resolve-release-context.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-release-context.outputs.deploy_environment }}
          DEPLOY_APPLICATION: ${{ needs.resolve-release-context.outputs.deploy_application }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          IMAGE_NAME_PREFIX: ${{ needs.resolve-release-context.outputs.image_name_prefix }}
          ENABLED_SERVICES_JSON: ${{ needs.resolve-release-context.outputs.enabled_services_json }}
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME_PREFIX}"
          images="$(jq -nc \
            --arg image_prefix "${IMAGE_PREFIX}" \
            --arg version "${VERSION}" \
            --argjson services "${ENABLED_SERVICES_JSON}" \
            'reduce $services[] as $service ({}; .[$service] = "\($image_prefix)-\($service):\($version)")'
          )"

          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "${DEPLOY_ENVIRONMENT}" \
            --arg version "${VERSION}" \
            --arg sha "${GITHUB_SHA}" \
            --arg source_repository "${SOURCE_REPOSITORY}" \
            --arg source_ref "${SOURCE_REF}" \
            --argjson images "${images}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                source_repository: $source_repository,
                source_ref: $source_ref,
                release_execution_mode: "github-hosted",
                images: $images
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"

  notify-server-local-deploy:
    name: Notify Deploy Repository For Server Local
    runs-on: self-hosted
    needs: resolve-release-context
    if: ${{ needs.resolve-release-context.outputs.enabled == 'true' && needs.resolve-release-context.outputs.release_execution_mode == 'server-local' && needs.resolve-release-context.outputs.deploy_environment == 'testing' }}

    steps:
      - name: Detect deploy dispatch config
        id: dispatch
        shell: bash
        env:
          DEPLOY_REPO: ${{ needs.resolve-release-context.outputs.deploy_repo }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "${DEPLOY_REPO}" || -z "${DISPATCH_TOKEN}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "reason=missing-dispatch-config" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=true" >> "${GITHUB_OUTPUT}"
          echo "dispatch_url=https://api.github.com/repos/${DEPLOY_REPO}/dispatches" >> "${GITHUB_OUTPUT}"

      - name: Skip deploy dispatch
        if: ${{ steps.dispatch.outputs.enabled != 'true' }}
        shell: bash
        run: |
          echo "server-local deploy dispatch skipped: ${{ steps.dispatch.outputs.reason || 'not-enabled' }}"

      - name: Dispatch server-local deploy event
        if: ${{ steps.dispatch.outputs.enabled == 'true' }}
        env:
          DISPATCH_URL: ${{ steps.dispatch.outputs.dispatch_url }}
          DISPATCH_TOKEN: ${{ secrets.DEPLOY_REPOSITORY_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ needs.resolve-release-context.outputs.deploy_event_type }}
          VERSION: ${{ needs.resolve-release-context.outputs.version }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-release-context.outputs.deploy_environment }}
          DEPLOY_APPLICATION: ${{ needs.resolve-release-context.outputs.deploy_application }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          payload="$(jq -n \
            --arg event_type "${EVENT_TYPE}" \
            --arg application "${DEPLOY_APPLICATION}" \
            --arg environment "${DEPLOY_ENVIRONMENT}" \
            --arg version "${VERSION}" \
            --arg sha "${GITHUB_SHA}" \
            --arg source_repository "${SOURCE_REPOSITORY}" \
            --arg source_ref "${SOURCE_REF}" \
            '{
              event_type: $event_type,
              client_payload: {
                application: $application,
                environment: $environment,
                version: $version,
                sha: $sha,
                source_repository: $source_repository,
                source_ref: $source_ref,
                release_execution_mode: "server-local",
                images: {}
              }
            }'
          )"

          curl --fail --show-error --silent \
            -X POST "${DISPATCH_URL}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "${payload}"
