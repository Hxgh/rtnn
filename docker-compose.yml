services:
  db:
    container_name: ${TEMPLATE_PROJECT_ID:-rtnn}-postgres-dev
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEMPLATE_DATABASE_NAME:-rtnn}
      POSTGRES_USER: ${TEMPLATE_DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${TEMPLATE_DATABASE_PASSWORD:-postgres}
    ports:
      - '${TEMPLATE_DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${TEMPLATE_DATABASE_USER:-postgres} -d ${TEMPLATE_DATABASE_NAME:-rtnn}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    name: ${TEMPLATE_PROJECT_ID:-rtnn}-postgres-data
