services:
  db:
    container_name: rtnn-postgres-dev
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rtnn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - rtnn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rtnn']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rtnn-postgres-data:
    name: rtnn-postgres-data
